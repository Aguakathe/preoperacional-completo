<header class="navbar">
  <div class="navbar-content">
    <div class="brand">
      <span class="brand-badge" aria-hidden="true"><app-icon name="moto" /></span>
      <span class="brand-text">NCR Atleos</span>
    </div>

    <div class="nav-section">
      <!-- Chip de usuario: el rol de administrador se muestra como un escudo sobre el avatar
           (antes "Administrador · admin · ADMIN" repetía lo mismo tres veces) -->
      <div class="user-chip" [attr.title]="esAdmin() ? 'Administrador' : 'Conductor'">
        <span class="avatar-wrap">
          <span class="avatar" [class.avatar-admin]="esAdmin()" aria-hidden="true">{{ inicial() }}</span>
          @if (esAdmin()) {
            <span class="admin-badge"><app-icon name="shield" aria-hidden="true" /><span class="sr-only">Administrador</span></span>
          }
        </span>
        <span class="user-textos">
          <span class="user-name">{{ nombre() }}</span>
          @if (usuario()?.nombre) { <span class="user-login">{{ usuario()?.username }}</span> }
        </span>
      </div>
      <button type="button" class="btn btn-light btn-sm logout-btn" (click)="logout()" [disabled]="saliendo" aria-label="Cerrar sesión">
        <app-icon name="logout" /><span class="logout-label">Salir</span>
      </button>
    </div>
  </div>
</header>
